{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5 text-center">
    <div class="card p-5">
      <h1 style="font-size: 5rem; color: var(--ot-orange); font-weight: 700;">{{ code }}</h1>
      <h4 style="color: var(--ot-navy);">{{ message }}</h4>
      <a href="/dashboard" class="btn btn-primary mt-3 px-4">Go to Dashboard</a>
    </div>
  </div>
</div>
{% endblock %}
